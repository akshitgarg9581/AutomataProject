[project]
name = "dfa-simulator"
version = "1.0.0"
description = "Interactive Deterministic Finite Automaton (DFA) Simulator for CSET302"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.35.0",
]

[project.scripts]
dfa-simulator = "dfa_simulator:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
